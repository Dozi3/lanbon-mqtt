[project]
name = "lanbon-mqtt-integration-tests"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"
dependencies = ["homeassistant==2026.9.3", "paho-mqtt==2.1.0"]

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.366", "ruff==0.16.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-p no:homeassistant"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
