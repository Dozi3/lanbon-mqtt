[project]
name = "lanbon-mqtt-integration-tests"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"
# The integration uses Home Assistant's native MQTT integration and has no
# installable Python distribution dependencies. These are development fixtures.
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2026.10.1",
    "paho-mqtt==2.1.0",
    "pytest-homeassistant-custom-component==0.13.372",
    "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-p no:homeassistant"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
