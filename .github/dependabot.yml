version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ruff-patches:
        patterns: ["ruff"]
        update-types: ["patch"]
      test-tooling:
        patterns: ["*"]
        exclude-patterns: ["ruff"]
