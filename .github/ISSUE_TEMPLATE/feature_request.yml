name: Feature or device support request
description: Describe a use case or an unrecognized Lanbon model.
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Explain the outcome you need and how current behavior falls short.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and firmware, if relevant
      description: Do not include serial numbers, MACs or network addresses.
  - type: textarea
    id: evidence
    attributes:
      label: Available evidence and testing
      description: Describe sanitized protocol evidence or physical tests you could perform.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no credentials or personal network details.
          required: true
