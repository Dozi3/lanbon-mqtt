name: Bug report
description: Report a reproducible integration problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the setup and troubleshooting guides first. Remove broker credentials,
        device MACs, network names, IPs, room names and private MQTT topics before posting.
        Device feedback and physical operation are separate observations.
  - type: input
    id: versions
    attributes:
      label: Integration and Home Assistant versions
      placeholder: "Lanbon MQTT 0.3.0-rc.4; Home Assistant 2026.10.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model and firmware
      description: Include hardware type and firmware where known; omit unique identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and observed behavior
      description: Include the expected result, actual result and relevant Control status reason.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics or logs
      description: Review all content before posting. Do not upload unreviewed MQTT captures.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and removed credentials and personal network details.
          required: true
