name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  tag:
    name: Require a version tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject branch dispatches
        env:
          RELEASE_REF: ${{ github.ref }}
        run: '[[ "$RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]'

  validate:
    name: Validate release
    needs: tag
    uses: ./.github/workflows/validate.yml

  publish:
    name: Publish verified package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.14"
      - name: Build with matching manifest and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project python tools/build_release.py --tag "$RELEASE_TAG"
      - name: Download package that passed validation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-package
          path: verified-package
      - name: Compare release bytes with tested artifact
        run: |
          cmp dist/SHA256SUMS verified-package/SHA256SUMS
          cmp dist/release-receipt.json verified-package/release-receipt.json
          for archive in dist/*.zip; do
            cmp "$archive" "verified-package/$(basename "$archive")"
          done
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/publish_release.py --tag "$RELEASE_TAG"
