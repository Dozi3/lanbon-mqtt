name: Safe maintenance

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_run:
    workflows: [Validate]
    types: [completed]
  # repository_dispatch uses the workflow definition on the default branch;
  # unlike workflow_dispatch it cannot select a branch-controlled definition.
  repository_dispatch:
    types: [lanbon-maintenance, lanbon-maintenance-dry-run]

permissions:
  contents: read

concurrency:
  group: safe-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Apply strictly classified maintenance
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    steps:
      # This privileged job always executes protected main, never PR source or
      # downloaded artifacts. Candidate source is inspected only as API data.
      - name: Check out trusted maintenance policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Process verified maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LANBON_RELEASE_PRS_ENABLED: ${{ vars.LANBON_RELEASE_PRS_ENABLED }}
          DRY_RUN: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'lanbon-maintenance-dry-run' }}
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 tools/maintenance.py "${args[@]}"
