name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests, lint and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.14"
          enable-cache: true
      - name: Install the isolated MQTT test broker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mosquitto
      - name: Install locked test dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Run all tests
        run: |
          mkdir -p test-results
          uv run --locked pytest -q --junitxml=test-results/pytest.xml
      - name: Require complete test execution
        run: |
          uv run --locked python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("test-results/pytest.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "No tests executed"
          assert not list(root.iter("skipped")), "Tests must not be silently skipped in CI"
          assert not list(root.iter("failure")), "Test failures are not allowed"
          assert not list(root.iter("error")), "Test errors are not allowed"
          print(f"All {len(cases)} tests executed successfully")
          PY
      - name: Build and verify a reproducible release
        run: |
          uv run --locked python tools/build_release.py
          cp dist/SHA256SUMS "$RUNNER_TEMP/first-SHA256SUMS"
          uv run --locked python tools/build_release.py
          cmp "$RUNNER_TEMP/first-SHA256SUMS" dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Save verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-package
          path: dist/
          retention-days: 14
          if-no-files-found: error

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate HACS repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: "false"
